# IaC pipeline: Terraform for everything under IaC/.
#   pull request  -> fmt check, validate, plan (dev)
#   push to main  -> plan + apply (dev)
#   manual run    -> plan, apply or destroy for a chosen environment
#                    (destroy requires typing the environment name to confirm)
# Changes under App/ never trigger this workflow.
name: IaC

on:
  push:
    branches: [main]
    paths:
      - 'IaC/**'
      - '!IaC/bootstrap/**'
      - '.github/workflows/iac.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IaC/**'
      - '!IaC/bootstrap/**'
      - '.github/workflows/iac.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run against
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: plan only, plan and apply, or destroy everything
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm_destroy:
        description: For destroy only - type the environment name (e.g. dev) to confirm
        type: string
        required: false
        default: ""

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read

concurrency:
  # One Terraform run per environment at a time; never cancel a running apply.
  group: iac-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: terraform (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: IaC
    env:
      TF_ENV: ${{ inputs.environment || 'dev' }}
      # Sensitive Terraform input, stored as a GitHub Environment secret.
      TF_VAR_order_api_key: ${{ secrets.ORDER_API_KEY }}
      # plan | apply | destroy. Push = apply, pull request = plan, manual = chosen input.
      ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'push' && 'apply' || 'plan') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm destroy
        if: env.ACTION == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM" != "$TF_ENV" ]; then
            echo "::error::Destroy not confirmed. Re-run and type '$TF_ENV' in 'confirm_destroy'."
            exit 1
          fi
          echo "::warning::Destroying ALL infrastructure in '$TF_ENV' (DynamoDB data, queues, Lambda, ...)."

      - name: Check required GitHub secrets
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=0
          for v in AWS_ROLE_TO_ASSUME AWS_REGION; do
            if [ -z "${!v}" ]; then echo "::error::Secret '$v' is not set (repository or GitHub Environment '$TF_ENV')"; missing=1; fi
          done
          if [ -z "$TF_VAR_order_api_key" ]; then echo "::warning::Secret ORDER_API_KEY is not set on '$TF_ENV'; ORDER_API_KEY will be empty"; fi
          exit $missing

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-iac-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config="environments/${TF_ENV}/backend.hcl"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          destroy_flag=""
          if [ "$ACTION" = "destroy" ]; then destroy_flag="-destroy"; fi
          terraform plan $destroy_flag -out=tfplan -var-file="environments/${TF_ENV}/terraform.tfvars"

      # For destroy, the saved plan is a destroy plan, so this deletes everything.
      - name: Apply
        if: env.ACTION == 'apply' || env.ACTION == 'destroy'
        run: terraform apply tfplan

      # Layer versions are published by the App pipeline, not Terraform, so
      # terraform destroy does not remove them.
      - name: Delete Lambda layer versions
        if: env.ACTION == 'destroy' && vars.LAYER_NAME != ''
        env:
          LAYER_NAME: ${{ vars.LAYER_NAME }}
        run: |
          for v in $(aws lambda list-layer-versions --layer-name "$LAYER_NAME" --query 'LayerVersions[].Version' --output text); do
            aws lambda delete-layer-version --layer-name "$LAYER_NAME" --version-number "$v"
            echo "Deleted $LAYER_NAME:$v"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### IaC - ${TF_ENV}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Action: ${ACTION}"
          } >> "$GITHUB_STEP_SUMMARY"
